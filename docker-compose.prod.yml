services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ispmax
      - POSTGRES_USER=ispmax
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ispmax-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispmax -d ispmax"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - ispmax-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - CACHE_TYPE=SimpleCache
      - CACHE_REDIS_URL=
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ALLOW_INSECURE_GOOGLE_LOGIN=${ALLOW_INSECURE_GOOGLE_LOGIN:-false}
    command: ["/bin/sh","-c","CACHE_TYPE=SimpleCache CACHE_REDIS_URL= gunicorn --bind 0.0.0.0:5000 --workers 2 wsgi:app"]
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - backups:/app/backups
    networks:
      - ispmax-network
    labels:
      - "traefik.enable=true"
      # Ruta principal: api.fastisp.cloud → backend
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-api.fastisp.cloud}`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.routers.api.priority=120"
      - "traefik.http.routers.api.middlewares=secure-headers@docker,ipwhitelist@docker"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
      # Ruta alternativa: fastisp.cloud/api → backend (para VITE_API_URL=https://fastisp.cloud/api)
      - "traefik.http.routers.api-path.rule=Host(`${FRONTEND_HOST:-fastisp.cloud}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-path.entrypoints=web,websecure"
      - "traefik.http.routers.api-path.tls.certresolver=myresolver"
      - "traefik.http.routers.api-path.priority=150"
      - "traefik.http.routers.api-path.middlewares=secure-headers@docker,ipwhitelist@docker"
      - "traefik.http.routers.api-path.service=api"


  frontend:
    build:
      context: ./frontend
      target: production
      args:
        - VITE_API_URL=${API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_GRAFANA_URL=${VITE_GRAFANA_URL}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - VITE_API_URL=${API_URL}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    networks:
      - ispmax-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_HOST:-fastisp.cloud}`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.frontend.priority=100"
      - "traefik.http.routers.frontend.middlewares=secure-headers@docker,ipwhitelist@docker"
      - "traefik.http.routers.frontend-tenants.rule=HostRegexp(`{tenant:[a-z0-9-]+}.${TENANCY_ROOT_DOMAIN:-fastisp.cloud}`)"
      - "traefik.http.routers.frontend-tenants.entrypoints=web,websecure"
      - "traefik.http.routers.frontend-tenants.tls.certresolver=myresolver"
      - "traefik.http.routers.frontend-tenants.priority=10"
      - "traefik.http.routers.frontend-tenants.middlewares=secure-headers@docker,ipwhitelist@docker"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  celery-worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - CACHE_TYPE=SimpleCache
      - CACHE_REDIS_URL=
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - ispmax-network

  celery-beat:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - CACHE_TYPE=SimpleCache
      - CACHE_REDIS_URL=
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=info"]
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - ispmax-network

  softether-vpn:
    # Imagen oficial de SoftEther VPN Server v4.43
    # Soporta SSTP, L2TP, OpenVPN, EtherIP
    image: siomiz/softethervpn:latest
    container_name: fastisp-softether
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      # Contraseña del servidor (se aplica al iniciar)
      - SPW=${SOFTETHER_ADMIN_PASSWORD:-FastISP_VPN_2026!}
      # Contraseña del hub por defecto
      - HPW=${SOFTETHER_HUB_PASSWORD:-FastISP_Hub_2026!}
    ports:
      # Puerto SSTP para MikroTik (8443 para no conflictar con Traefik en 443)
      - "8443:443"
      # Puerto alternativo SSTP
      - "992:992"
      # OpenVPN
      - "1194:1194/udp"
    volumes:
      - softether-data:/usr/vpnserver
    networks:
      - ispmax-network
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/vpnserver/vpn_server.config || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  traefik:
    # Traefik v2.6 es compatible con Docker Engine antiguo (API 1.24+)
    # Si actualizas Docker en el VPS puedes subir a traefik:v2.10
    image: traefik:v2.6
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ispmax-network
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.myresolver.acme.httpchallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.myresolver.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --entrypoints.websecure.forwardedheaders.insecure=true
      - --serverstransport.insecureskipverify=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./deploy/traefik:/etc/traefik/dynamic:ro
      - ./deploy/geoip:/geoip:ro
    networks:
      - ispmax-network
    labels:
      - "traefik.http.middlewares.secure-headers.headers.framedeny=true"
      - "traefik.http.middlewares.secure-headers.headers.contenttypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer-when-downgrade"
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.ipwhitelist.ipwhitelist.sourcerange=${WAF_IP_ALLOWLIST:-0.0.0.0/0}"
      - "traefik.http.middlewares.geoip2.plugin.geoip2.databasePath=/geoip/GeoLite2-Country.mmdb"
      - "traefik.http.middlewares.geoip2.plugin.geoip2.header=X-Country-Code"

volumes:
  pgdata:
  backups:
  letsencrypt:
  softether-data:
  softether-logs:

networks:
  ispmax-network:
    driver: bridge
